summary: 강화학습으로 긴 사고 과정을 학습한 대형 MoE 추론 모델. 수학·코딩·논리 문제에 강하다.
useCases:
  - 수학·알고리즘 문제 풀이
  - 복잡한 코드 디버깅·설계 검토
  - 추론 과정 증류(distillation)용 교사 모델
strengths:
  - MIT 라이선스로 상업 이용과 증류가 자유로움
  - Qwen/Llama 기반 소형 증류 모델 계열이 함께 공개됨
limitations:
  - 원본 모델은 서빙에 다중 GPU 노드급 자원이 필요
  - 사고 토큰이 길어 지연·비용이 큼
  - DeepSeek 의 후속 V4 계열은 한 모델에서 Non-think·추론 모드를 전환하는 방식으로 통합됨
capabilities: [long-context]
sources:
