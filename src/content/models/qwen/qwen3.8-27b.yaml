summary: 이미지·영상을 기본으로 이해하는 27B dense 모델. 코딩·장기 에이전트 작업을 강화했고 thinking 을 요청별로 끌 수 있다.
useCases:
  - 단일 고사양 GPU에서 운영하는 코딩·업무 자동화 에이전트
  - 문서·도표·장시간 영상까지 함께 다루는 멀티모달 질의응답
strengths:
  - Gated DeltaNet 선형 어텐션과 Gated Attention 을 섞어 긴 컨텍스트 효율이 높음
  - 기본 262K 컨텍스트, 최대 1M 토큰까지 확장 가능
  - reasoning_effort 와 preserve_thinking 으로 사고 깊이·이력 제어
  - Apache-2.0
limitations:
  - thinking 이 기본으로 켜져 있어 짧은 응답에는 끄는 설정이 필요
  - 같은 세대의 Qwen3.8-2.4T-A95B·Flash-Next 는 별도 라이선스(Apache-2.0 아님)
capabilities: [tool-calling, long-context]
