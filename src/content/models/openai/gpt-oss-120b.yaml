summary: OpenAI 가 공개한 텍스트 전용 MoE 추론 모델. 추론 강도(low/medium/high)를 조절하며 단일 80GB GPU에서 돌아간다.
useCases:
  - 단일 H100급 GPU 한 장으로 운영하는 사내 추론·에이전트 서버
  - 함수 호출·구조화 출력이 필요한 업무 자동화 에이전트
  - 사고 과정(CoT)을 확인하며 디버깅하는 추론 파이프라인
strengths:
  - MoE 가중치를 MXFP4 로 사후 학습해 80GB GPU 한 장에 적재 가능
  - 함수 호출, 웹 브라우징·Python 실행 도구, Structured Outputs 를 기본 지원
  - Apache-2.0 라이선스
limitations:
  - 텍스트 전용이라 이미지 입력을 받지 않음
  - 사고 끄기 모드가 없어 단순 응답에도 추론 토큰이 붙음
capabilities: [tool-calling, long-context, structured-output]
